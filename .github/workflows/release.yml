name: Verify And Promote Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag
        required: true
        type: string
      expected_commit:
        description: Exact 40-character release commit
        required: true
        type: string
      expected_manifest_sha256:
        description: SHA-256 of the uploaded manifest
        required: true
        type: string
      expected_release_id:
        description: Immutable numeric ID of the existing draft release
        required: true
        type: string
      allow_unsigned:
        description: Permit an intentionally unsigned Windows wrapper
        required: true
        default: false
        type: boolean
      accepted_name_risk:
        description: Confirm the documented Eve name/mark risk acceptance
        required: true
        default: false
        type: boolean
      publish_prerelease:
        description: Publish a hyphenated semantic-version tag as a prerelease, never latest
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eve-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-draft:
    name: Verify existing draft assets (no build or upload)
    runs-on: windows-latest
    # GitHub requires write-capable contents permission to read an existing draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require immutable trunk control-plane checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/trunk') { throw 'Dispatch only from trunk.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Control-plane checkout mismatch: HEAD=$head GITHUB_SHA=$env:GITHUB_SHA" }
      - name: Require explicit risk gates
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          ACCEPTED_NAME_RISK: ${{ inputs.accepted_name_risk }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_RELEASE_ID -notmatch '^[1-9][0-9]*$' -or $env:PUBLISH_PRERELEASE -notin @('true', 'false')) { throw 'Malformed release inputs.' }
          if ($env:ACCEPTED_NAME_RISK -ne 'true') { throw 'Name-risk acceptance must be explicit.' }
          $tagIsPrerelease = $env:TAG -match '-'
          if (($env:PUBLISH_PRERELEASE -eq 'true') -ne $tagIsPrerelease) { throw 'Prerelease intent must match the semantic-version tag.' }
      - name: Download existing draft assets only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Resolve-ReleaseTagCommit {
            $refJson = gh api "repos/${{ github.repository }}/git/ref/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Exact release tag does not exist.' }
            $object = ($refJson | ConvertFrom-Json).object
            $depth = 0
            while ($object.type -eq 'tag') {
              $depth++
              if ($depth -gt 4) { throw 'Release tag indirection exceeds the supported bound.' }
              $tagJson = gh api "repos/${{ github.repository }}/git/tags/$($object.sha)"
              if ($LASTEXITCODE -ne 0) { throw 'Annotated release tag could not be resolved.' }
              $object = ($tagJson | ConvertFrom-Json).object
            }
            if ($object.type -ne 'commit') { throw 'Release tag does not resolve to a commit.' }
            return [string]$object.sha
          }
          $tagCommit = Resolve-ReleaseTagCommit
          if ($tagCommit -ne $env:EXPECTED_COMMIT) { throw 'Release tag commit does not match ExpectedCommit.' }
          $releaseJson = gh api "repos/${{ github.repository }}/releases/$env:EXPECTED_RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release ID could not be fetched.' }
          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.id -ne $env:EXPECTED_RELEASE_ID -or -not $release.draft -or [bool]$release.prerelease -ne ($env:PUBLISH_PRERELEASE -eq 'true') -or $release.tag_name -ne $env:TAG -or $release.target_commitish -ne $env:EXPECTED_COMMIT) { throw 'An exact-ID, exact-target draft release with matching prerelease intent is required.' }
          $version = $env:TAG.Substring(1)
          $expectedNames = @(
            "Eve.Web.Setup.$version.exe",
            "murmur-$version-x64.nsis.7z",
            'latest.yml',
            "eve-$env:TAG-artifact-manifest.json",
            'SHA256SUMS.txt',
            'SHA512SUMS.txt',
            'THIRD_PARTY_NOTICES.txt'
          )
          $assets = @($release.assets)
          if ($assets.Count -ne $expectedNames.Count -or (@($assets.name | Sort-Object) -join "`n") -ne (@($expectedNames | Sort-Object) -join "`n")) { throw 'Draft release asset allowlist mismatch.' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($asset in $assets) {
            if ([string]$asset.id -notmatch '^[1-9][0-9]*$' -or [int64]$asset.size -le 0 -or $asset.state -ne 'uploaded' -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$' -or $asset.url -ne "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)") { throw "Malformed asset metadata for $($asset.name)." }
            curl.exe --silent --show-error --fail --location `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header 'Accept: application/octet-stream' `
              --output (Join-Path release-assets $asset.name) `
              $asset.url
            if ($LASTEXITCODE -ne 0) { throw "Authenticated asset download failed for $($asset.name)." }
            $download = Get-Item -LiteralPath (Join-Path release-assets $asset.name)
            $downloadDigest = "sha256:$((Get-FileHash -LiteralPath $download.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($download.Length -ne [int64]$asset.size -or $downloadDigest -ne $asset.digest) { throw "Downloaded asset metadata mismatch for $($asset.name)." }
          }
      - name: Verify draft manifest and artifacts
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\release-artifacts.ps1 -Mode Verify -ArtifactDir release-assets -ExpectedTag $env:TAG -ExpectedCommit $env:EXPECTED_COMMIT -ExpectedManifestSha256 $env:EXPECTED_MANIFEST_SHA256 -AllowUnsigned:($env:ALLOW_UNSIGNED -eq 'true')

  promote:
    name: Reverify and publish the verified draft
    needs: verify-draft
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require immutable trunk control-plane checkout after approval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/trunk') { throw 'Dispatch only from trunk.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Control-plane checkout mismatch: HEAD=$head GITHUB_SHA=$env:GITHUB_SHA" }
      - name: Re-download and reverify after approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' -or $env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_RELEASE_ID -notmatch '^[1-9][0-9]*$' -or $env:EXPECTED_MANIFEST_SHA256 -notmatch '^[0-9a-fA-F]{64}$' -or $env:ALLOW_UNSIGNED -notin @('true', 'false') -or $env:PUBLISH_PRERELEASE -notin @('true', 'false')) { throw 'Malformed release inputs.' }
          function Resolve-ReleaseTagCommit {
            $refJson = gh api "repos/${{ github.repository }}/git/ref/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Exact release tag does not exist.' }
            $object = ($refJson | ConvertFrom-Json).object
            $depth = 0
            while ($object.type -eq 'tag') {
              $depth++
              if ($depth -gt 4) { throw 'Release tag indirection exceeds the supported bound.' }
              $tagJson = gh api "repos/${{ github.repository }}/git/tags/$($object.sha)"
              if ($LASTEXITCODE -ne 0) { throw 'Annotated release tag could not be resolved.' }
              $object = ($tagJson | ConvertFrom-Json).object
            }
            if ($object.type -ne 'commit') { throw 'Release tag does not resolve to a commit.' }
            return [string]$object.sha
          }
          $tagCommit = Resolve-ReleaseTagCommit
          if ($tagCommit -ne $env:EXPECTED_COMMIT) { throw 'Release tag commit does not match ExpectedCommit.' }
          $releaseJson = gh api "repos/${{ github.repository }}/releases/$env:EXPECTED_RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release ID could not be re-fetched after approval.' }
          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.id -ne $env:EXPECTED_RELEASE_ID -or -not $release.draft -or [bool]$release.prerelease -ne ($env:PUBLISH_PRERELEASE -eq 'true') -or $release.tag_name -ne $env:TAG -or $release.target_commitish -ne $env:EXPECTED_COMMIT) { throw 'Draft ID, target, prerelease intent, or state changed after verification.' }
          $version = $env:TAG.Substring(1)
          $expectedNames = @(
            "Eve.Web.Setup.$version.exe",
            "murmur-$version-x64.nsis.7z",
            'latest.yml',
            "eve-$env:TAG-artifact-manifest.json",
            'SHA256SUMS.txt',
            'SHA512SUMS.txt',
            'THIRD_PARTY_NOTICES.txt'
          )
          $assets = @($release.assets)
          if ($assets.Count -ne $expectedNames.Count -or (@($assets.name | Sort-Object) -join "`n") -ne (@($expectedNames | Sort-Object) -join "`n")) { throw 'Draft release asset allowlist changed after verification.' }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          foreach ($asset in $assets) {
            if ([string]$asset.id -notmatch '^[1-9][0-9]*$' -or [int64]$asset.size -le 0 -or $asset.state -ne 'uploaded' -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$' -or $asset.url -ne "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)") { throw "Malformed asset metadata for $($asset.name)." }
            curl.exe --silent --show-error --fail --location `
              --header "Authorization: Bearer $env:GH_TOKEN" `
              --header 'Accept: application/octet-stream' `
              --output (Join-Path release-assets $asset.name) `
              $asset.url
            if ($LASTEXITCODE -ne 0) { throw "Authenticated asset download failed for $($asset.name)." }
            $download = Get-Item -LiteralPath (Join-Path release-assets $asset.name)
            $downloadDigest = "sha256:$((Get-FileHash -LiteralPath $download.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($download.Length -ne [int64]$asset.size -or $downloadDigest -ne $asset.digest) { throw "Downloaded asset metadata mismatch for $($asset.name)." }
          }
          & .\scripts\release-artifacts.ps1 -Mode Verify -ArtifactDir release-assets -ExpectedTag $env:TAG -ExpectedCommit $env:EXPECTED_COMMIT -ExpectedManifestSha256 $env:EXPECTED_MANIFEST_SHA256 -AllowUnsigned:($env:ALLOW_UNSIGNED -eq 'true')
      - name: Publish the existing verified draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLISH_PRERELEASE -eq 'true') {
            gh release edit $env:TAG --repo '${{ github.repository }}' --draft=false --prerelease --latest=false
          } else {
            gh release edit $env:TAG --repo '${{ github.repository }}' --draft=false --prerelease=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
